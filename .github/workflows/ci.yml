name: CI

# Runs on every pull request into dev or main, and on pushes to them. A PR can only merge
# when this is green (enforced via branch protection — see CONTRIBUTING.md).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — typecheck, build & tests
    runs-on: ubuntu-latest
    # Disposable Postgres for the e2e suite (auth, permissions, moderation, audit). The
    # harness refuses any non-local database URL, so tests can never touch dev/prod.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghor
          POSTGRES_PASSWORD: ghor_test
          POSTGRES_DB: ghor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ghor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ghor:ghor_test@localhost:5432/ghor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Prisma client is generated code; it doesn't need a database to generate.
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx tsc --noEmit -p .
        working-directory: apps/api
      - run: npm run build
        working-directory: apps/api
      - name: Unit tests
        run: npm test
        working-directory: apps/api
      - name: E2E tests (migrations + authorization + moderation)
        run: npm run test:e2e
        working-directory: apps/api

  web:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
        working-directory: apps/web
      - run: npx next build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  admin:
    name: Admin console — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
        working-directory: apps/admin
      - run: npx next build
        working-directory: apps/admin
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  admin-e2e:
    name: Admin console — browser smoke test (Playwright)
    runs-on: ubuntu-latest
    needs: [api, admin]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghor
          POSTGRES_PASSWORD: ghor_test
          POSTGRES_DB: ghor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ghor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ghor:ghor_test@localhost:5432/ghor_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run build
        working-directory: apps/api
      - run: npx next build
        working-directory: apps/admin
      - run: npx playwright install --with-deps chromium
        working-directory: apps/admin
      - run: npx playwright test
        working-directory: apps/admin

  mobile:
    name: Mobile — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
        working-directory: apps/mobile
